<!doctype html><html><head><title>Join</title></head><body>
<!-- PLACEHOLDER: UI-002 replaces this file. Keep {{error}} {{email}} placeholders. -->
<h1>Join</h1><p role="alert">{{error}}</p>
<form method="post" action="/join">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" value="{{email}}" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
<button type="submit">Create account</button></form></body></html>
