<!doctype html><html><head><title>Verify</title></head><body>
<!-- PLACEHOLDER: UI-002 replaces this file. Keep {{error}} {{message}} {{email}} {{verified}} placeholders. -->
<h1>Verify your email</h1><p role="alert">{{error}}</p><p role="status" data-verified="{{verified}}">{{message}}</p>
<form method="post" action="/verify">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" value="{{email}}" required>
<label for="code">Verification code</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
<button type="submit">Verify</button></form></body></html>
